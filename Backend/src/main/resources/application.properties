spring.application.name=smarttravel
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_travel}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
server.port=9090
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500}

# ===========================
# External APIs Configuration
# ===========================

# Unsplash API Configuration
unsplash.api.key=${UNSPLASH_API_KEY:}
unsplash.api.url=https://api.unsplash.com

# OpenWeather (Open-Meteo) Configuration
weather.api.url=https://api.open-meteo.com/v1/forecast

# Nominatim/OpenStreetMap Configuration
geocode.api.url=https://nominatim.openstreetmap.org

# Nager.Date API Configuration
holiday.api.url=https://date.nager.at/api/v3

# ===========================
# Caching Configuration
# ===========================
spring.cache.type=simple
spring.cache.cache-names=weather,forecast,holidays,upcoming-holidays,long-weekends,geocode,reverse-geocode,place-search,travel-images,city-images,place-images

# ===========================
# Logging Configuration
# ===========================
logging.level.com.riya.smarttravel=INFO
logging.level.okhttp3=DEBUG

# ===========================
# AI / RAG Planner Configuration
# ===========================
planner.ai.enabled=${PLANNER_AI_ENABLED:true}
planner.ai.api.url=${PLANNER_AI_API_URL:https://openrouter.ai/api/v1/chat/completions}
planner.ai.api.key=${OPENROUTER_API_KEY:}
planner.ai.model=${PLANNER_AI_MODEL:openai/gpt-4o-mini}
# Increase max tokens to support full multi-day itineraries (7-day plan needs ~4000 tokens)
planner.ai.max-tokens=${PLANNER_AI_MAX_TOKENS:4000}

# Frontend static assets location configuration
app.frontend.path=${APP_FRONTEND_PATH:}
